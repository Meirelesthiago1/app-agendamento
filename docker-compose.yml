services:
  postgres:
    image: postgres:18-alpine
    container_name: agendamento-postgres
    environment:
      POSTGRES_USER: agendamento
      POSTGRES_PASSWORD: agendamento
      POSTGRES_DB: agendamento
    ports:
      - '5432:5432'
    volumes:
      # A partir da 18 a imagem guarda os dados em subdiretório por versão maior, para
      # permitir `pg_upgrade --link`. Montar em /data faz o container recusar subir.
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agendamento -d agendamento']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: agendamento-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dados:
