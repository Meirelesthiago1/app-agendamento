name: CI

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm tipos

      - name: Regras de arquitetura
        run: pnpm regras

      # Build antes dos testes: os testes de integração importam os pacotes pelo
      # `exports` do package.json, que aponta para dist.
      - name: Build
        run: pnpm build

      - name: Testes
        run: pnpm teste
